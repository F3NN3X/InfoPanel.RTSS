[FPS_Monitoring]
# InfoPanel.RTSS v1.1.6+ uses RTSS (RivaTuner Statistics Server) exclusively  
# RTSS must be running for FPS monitoring to work
# Works with any game that RTSS can hook, providing real-time FPS and frame times
# Anti-cheat compatible - reads passively from RTSS shared memory without injection

[Debug]
# Enable/disable debug logging to debug.log file
# Set to true to enable detailed logging for troubleshooting (RTSS, sensors, monitoring)
# Set to false to disable debug logging for production use
debug=false

[Display]
# Update interval in milliseconds for UI updates (1000 = 1 second)
updateInterval=1000

# Number of frames to use for smoothing calculations (used for 1% low calculation)
smoothingFrames=120

# Default message to display when no game is being captured
defaultCaptureMessage=Nothing to capture

# Custom Game Categories
# Define your own game categories by creating sections named [Game_Category_YourCategoryName]
# You can use exact process names, wildcard patterns (*), or comma-separated lists

[Game_Category_My Favorite Games]
# Individual pattern entries
pattern1=cyberpunk2077.exe
pattern2=*witcher*
pattern3=*battlefield*
# Or use a comma-separated list
processes=eldenring.exe,sekiro.exe,*souls*

[Game_Category_Competitive FPS]
processes=*valorant*,*csgo*,*cs2*,*overwatch*,*apex*,*rainbow*

[Game_Category_Racing Games]
processes=*forza*,*gran*,*dirt*,*f1*,*crew*,*nfs*

[Game_Category_VR Games]
processes=*vr*,*reality*,*alyx*,*beat*saber*

[Game_Category_Retro Games]
processes=*dosbox*,*scummvm*,*retroarch*,*emulator*

# Examples of pattern matching:
# exact.exe        - Exact match for "exact.exe"
# *steam*          - Any process containing "steam"
# game*.exe        - Processes starting with "game" and ending with ".exe"
# *epic*games*     - Processes containing both "epic" and "games"